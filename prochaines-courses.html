<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prochaines courses — Trail Team</title>
  <meta name="theme-color" content="#07090d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .group-title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; margin: 2.5rem 0 1rem; display: flex; align-items: center; gap: 0.6rem; }
    .group-title:first-child { margin-top: 0; }
    .group-title .count { font-family: var(--font); font-size: 0.75rem; font-weight: 700; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.6rem; }
    .race-card.is-done .race-card-media img { filter: saturate(0.6); }
  </style>
</head>
<body data-page="upcoming">

<main class="main">
  <div class="page-header">
    <div class="page-eyebrow">🗓️ Calendrier</div>
    <h1 class="page-title">Prochaines courses</h1>
    <p class="page-sub">Les objectifs à venir et le compte à rebours jusqu'au départ. Clique sur une course pour tous les détails.</p>
  </div>
  <div class="page-content">
    <div class="filters runner-filter-bar" id="runnerFilter"></div>
    <div id="content">
    <div class="card-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </div>
</main>

<script src="shared.js"></script>
<script>
  var races = [];
  let runner = null;

  async function loadPage() {
    const { data, error } = await sb.from('races').select('*').eq('type', 'upcoming').order('date', { ascending: true });
    const el = document.getElementById('content');
    if (error) { el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Impossible de charger les courses.</p></div>`; return; }
    races = data || [];
    runner = mountRunnerFilter(document.getElementById('runnerFilter'), runnersCache, sel => { runner = sel; render(); });
    render();
  }

  function render() {
    const el = document.getElementById('content');
    const races = runner ? window.races.filter(r => r.runner_id === runner.id) : window.races;
    if (!races.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">🗓️</div><p>Aucune course à venir pour le moment</p></div>'; return; }

    const future = races.filter(r => daysUntil(r.date) >= 0);
    const done = races.filter(r => daysUntil(r.date) < 0).reverse();
    let html = '';
    if (future.length) html += `<h2 class="group-title">À venir <span class="count">${future.length}</span></h2><div class="card-grid">${future.map(card).join('')}</div>`;
    else html += `<div class="empty" style="padding:2.5rem 1rem"><div class="empty-icon">🎯</div><p>Pas de nouvel objectif programmé pour l'instant.</p></div>`;
    if (done.length) html += `<h2 class="group-title">Date passée · résultat à venir <span class="count">${done.length}</span></h2><div class="card-grid">${done.map(card).join('')}</div>`;
    el.innerHTML = html;
  }

  function countdown(r) {
    const d = daysUntil(r.date);
    if (d < 0) return `<div class="countdown">Terminée<small>il y a ${-d} jour${d < -1 ? 's' : ''}</small></div>`;
    if (d === 0) return `<div class="countdown grad-text">Jour J !</div>`;
    return `<div class="countdown"><span class="grad-text">J-${d}</span><small>avant le départ</small></div>`;
  }

  function card(r, i) {
    const st = STATUS[r.status] || STATUS.objectif;
    const done = daysUntil(r.date) < 0;
    return `
    <button class="race-card${done ? ' is-done' : ''}" onclick="showRace('${r.id}')">
      <div class="race-card-media">
        ${r.image_url ? `<img src="${esc(r.image_url)}" alt="" loading="lazy" />` : `<div class="no-img">${MOUNTAIN_SVG}</div>`}
        <div class="media-top">
          <span class="date-chip">📅 ${fmtDate(r.date, { day: 'numeric', month: 'short', year: 'numeric' })}</span>
          <span class="media-chips">${runnerChip(runnerById(r.runner_id))}${countryChip(r.country, true)}</span>
        </div>
        ${countdown(r)}
      </div>
      <div class="race-card-body">
        <div class="race-card-kicker" style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">${esc(RACE_TYPES[r.race_type] || 'Trail')}<span class="badge ${st.cls}">${st.label}</span></div>
        <div class="race-card-name">${esc(r.name)}</div>
        <div class="race-card-loc">📍 ${esc(r.location || '—')}</div>
        <div class="race-card-specs">
          ${r.distance ? `<span class="spec">📏 ${esc(r.distance)} km</span>` : ''}
          ${r.dplus ? `<span class="spec">⛰️ ${fmtNum(r.dplus)} m D+</span>` : ''}
        </div>
      </div>
    </button>`;
  }

  function showRace(id) {
    const r = window.races.find(x => x.id === id);
    if (!r) return;
    const st = STATUS[r.status] || STATUS.objectif;
    const d = daysUntil(r.date);
    openDrawer(`
      <div class="drawer-cover">${r.image_url ? `<img src="${esc(r.image_url)}" alt="" />` : `<div class="no-img">${MOUNTAIN_SVG}</div>`}</div>
      <div class="drawer-head">
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">${runnerChip(runnerById(r.runner_id))}${countryChip(r.country)}<span class="badge ${st.cls}">${st.label}</span></div>
        <div class="drawer-title" style="margin-top:.7rem">${esc(r.name)}</div>
        <div class="drawer-sub">📍 ${esc(r.location || '—')} · ${fmtDate(r.date)}</div>
      </div>
      <div class="drawer-body">
        <div class="drawer-section">
          <div class="drawer-section-title">📋 La course</div>
          <div class="kpi-grid">
            <div class="kpi accent"><div class="kpi-val">${d < 0 ? 'Passée' : d === 0 ? 'Jour J' : 'J-' + d}</div><div class="kpi-lbl">Compte à rebours</div></div>
            <div class="kpi"><div class="kpi-val">${esc(RACE_TYPES[r.race_type] || 'Trail')}</div><div class="kpi-lbl">Type</div></div>
            <div class="kpi"><div class="kpi-val">${r.distance ? esc(r.distance) + ' km' : '—'}</div><div class="kpi-lbl">Distance</div></div>
            <div class="kpi"><div class="kpi-val">${r.dplus ? fmtNum(r.dplus) + ' m' : '—'}</div><div class="kpi-lbl">Dénivelé +</div></div>
          </div>
        </div>
        ${r.notes ? `<div class="drawer-section"><div class="drawer-section-title">📝 Notes & objectifs</div><div class="drawer-notes">${esc(r.notes)}</div></div>` : ''}
        ${mediaSections(r)}
        <div class="drawer-section"><div class="drawer-section-title">💬 Commentaires</div><div id="raceComments"></div></div>
      </div>`);
    mountComments(document.getElementById('raceComments'), { raceId: r.id, placeholder: 'Un mot sur cette course ?' });
  }

  initPage({ requireAuth: true, onReady: loadPage });
</script>
</body>
</html>
