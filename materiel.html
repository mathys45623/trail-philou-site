<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matériel — Trail Team</title>
  <meta name="theme-color" content="#07090d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="gear">

<main class="main">
  <div class="page-header">
    <div class="page-eyebrow">🎒 Équipement</div>
    <h1 class="page-title">Matériel</h1>
    <p class="page-sub">Chaussures, sac, nutrition, électronique… tout ce qui accompagne l'équipe sur les sentiers, avec un avis honnête.</p>
  </div>
  <div class="page-content">
    <div class="filters runner-filter-bar" id="runnerFilter"></div>
    <div class="filters" id="catFilters"></div>
    <div class="card-grid" id="matGrid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>
</main>

<script src="shared.js"></script>
<script>
  const CAT_EMOJI = { 'Chaussures': '👟', 'Vêtements': '👕', 'Sac & Hydratation': '🎒', 'Nutrition': '🍌', 'Électronique': '⌚', 'Accessoires': '🧤', 'Autre': '📦' };
  let allItems = [];
  let runner = null;
  const mine = () => runner ? allItems.filter(i => i.runner_id === runner.id) : allItems;

  async function loadPage() {
    const { data, error } = await sb.from('materiel').select('*').order('categorie').order('nom');
    if (error) {
      document.getElementById('matGrid').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Impossible de charger le matériel.</p></div>';
      return;
    }
    allItems = data || [];
    runner = mountRunnerFilter(document.getElementById('runnerFilter'), runnersCache, sel => { runner = sel; buildFilters(); renderItems('all'); });
    buildFilters();
    renderItems('all');
  }

  function buildFilters() {
    const cats = [...new Set(mine().map(i => i.categorie).filter(Boolean))];
    const el = document.getElementById('catFilters');
    el.style.display = cats.length ? '' : 'none';
    if (!cats.length) return;
    el.innerHTML = `<button class="chip active" data-cat="all">Tout voir · ${mine().length}</button>` +
      cats.map(c => `<button class="chip" data-cat="${esc(c)}">${CAT_EMOJI[c] || '📦'} ${esc(c)}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      el.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === b));
      renderItems(b.dataset.cat);
    }));
  }

  function renderItems(cat) {
    const list = cat === 'all' ? mine() : mine().filter(i => i.categorie === cat);
    const el = document.getElementById('matGrid');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">🎒</div><p>Aucun équipement pour le moment</p></div>';
      return;
    }
    el.innerHTML = list.map((item, i) => `
      <article class="mat-card">
        <div class="mat-card-img">
          ${item.image_url ? `<img src="${esc(item.image_url)}" alt="${esc(item.nom)}" loading="lazy" />` : `<div class="no-img">${CAT_EMOJI[item.categorie] || '📦'}</div>`}
        </div>
        <div class="mat-card-body">
          <div class="mat-card-cat" style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">${esc(item.categorie || 'Matériel')}${runner ? '' : runnerChip(runnerById(item.runner_id))}</div>
          <div class="mat-card-name">${esc(item.nom)}</div>
          ${item.marque ? `<div class="mat-card-brand">${esc(item.marque)}</div>` : ''}
          ${item.description ? `<div class="mat-card-desc">${esc(item.description)}</div>` : ''}
          ${item.avis ? `<div class="mat-card-avis"><div>⭐ ${esc(item.avis)}</div></div>` : ''}
        </div>
      </article>`).join('');
  }

  initPage({ requireAuth: true, onReady: loadPage });
</script>
</body>
</html>
