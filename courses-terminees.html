<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses terminées — Trail Philou</title>
  <meta name="theme-color" content="#07090d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="past">

<main class="main">
  <div class="page-header">
    <div class="page-eyebrow">🏆 Palmarès</div>
    <h1 class="page-title">Courses terminées</h1>
    <p class="page-sub">Toutes les lignes d'arrivée franchies. Clique sur une course pour voir le résultat, les notes, les photos et les vidéos.</p>
  </div>
  <div class="page-content">
    <div class="filters" id="yearFilters"></div>
    <div class="card-grid" id="racesGrid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>
</main>

<script src="shared.js"></script>
<script>
  let races = [];
  let year = 'all';

  async function loadPage() {
    const { data, error } = await sb.from('races').select('*').eq('type', 'past').order('date', { ascending: false });
    if (error) {
      document.getElementById('racesGrid').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Impossible de charger les courses.</p></div>`;
      return;
    }
    races = data || [];
    buildFilters();
    renderGrid();
  }

  function buildFilters() {
    const years = [...new Set(races.map(r => parseDate(r.date).getFullYear()))];
    const el = document.getElementById('yearFilters');
    if (years.length < 2) { el.style.display = 'none'; return; }
    el.innerHTML = ['all', ...years].map(y => `<button class="chip${y === year ? ' active' : ''}" data-year="${y}">${y === 'all' ? 'Toutes' : y}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      year = b.dataset.year === 'all' ? 'all' : +b.dataset.year;
      el.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === b));
      renderGrid();
    }));
  }

  function renderGrid() {
    const el = document.getElementById('racesGrid');
    const list = year === 'all' ? races : races.filter(r => parseDate(r.date).getFullYear() === year);
    if (!list.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">🏅</div><p>Aucune course encore enregistrée</p></div>';
      return;
    }
    el.innerHTML = list.map((r, i) => {
      const imgs = toArr(r.images);
      const vids = toArr(r.videos);
      const cover = r.image_url || imgs[0];
      return `
      <button class="race-card" onclick="showRace('${r.id}')">
        <div class="race-card-media">
          ${cover ? `<img src="${esc(cover)}" alt="" loading="lazy" />` : `<div class="no-img">${MOUNTAIN_SVG}</div>`}
          <div class="media-top">
            <span class="date-chip">${fmtDate(r.date, { month: 'short', year: 'numeric' })}</span>
            ${r.race_type ? `<span class="badge badge-gray" style="background:rgba(7,9,13,.75)">${esc(RACE_TYPES[r.race_type] || r.race_type)}</span>` : ''}
          </div>
        </div>
        <div class="race-card-body">
          <div class="race-card-name">${esc(r.name)}</div>
          <div class="race-card-loc">📍 ${esc(r.location || '—')}</div>
          <div class="race-card-specs">
            ${r.distance ? `<span class="spec">📏 ${esc(r.distance)} km</span>` : ''}
            ${r.dplus ? `<span class="spec">⛰️ ${fmtNum(r.dplus)} m D+</span>` : ''}
          </div>
          <div class="race-card-foot">
            <div>
              ${r.finish_time ? `<div class="race-time">${esc(r.finish_time)}</div>` : '<div class="race-rank">Temps —</div>'}
              ${r.rank ? `<div class="race-rank">🏅 ${esc(r.rank)}</div>` : ''}
            </div>
            <div class="media-icons">
              ${imgs.length ? `<span title="${imgs.length} photo(s)">🖼️</span>` : ''}
              ${vids.length ? `<span title="${vids.length} vidéo(s)">🎬</span>` : ''}
            </div>
          </div>
        </div>
      </button>`;
    }).join('');
  }

  function showRace(id) {
    const r = races.find(x => x.id === id);
    if (!r) return;
    const imgs = toArr(r.images);
    const cover = r.image_url || imgs[0];
    openDrawer(`
      <div class="drawer-cover">${cover ? `<img src="${esc(cover)}" alt="" />` : `<div class="no-img">${MOUNTAIN_SVG}</div>`}</div>
      <div class="drawer-head">
        <div class="page-eyebrow">${esc(RACE_TYPES[r.race_type] || 'Trail')}</div>
        <div class="drawer-title">${esc(r.name)}</div>
        <div class="drawer-sub">📍 ${esc(r.location || '—')} · ${fmtDate(r.date)}</div>
      </div>
      <div class="drawer-body">
        <div class="drawer-section">
          <div class="drawer-section-title">📊 Résultat</div>
          <div class="kpi-grid">
            <div class="kpi accent"><div class="kpi-val">${esc(r.finish_time || '—')}</div><div class="kpi-lbl">Temps</div></div>
            <div class="kpi"><div class="kpi-val">${esc(r.rank || '—')}</div><div class="kpi-lbl">Classement</div></div>
            <div class="kpi"><div class="kpi-val">${r.distance ? esc(r.distance) + ' km' : '—'}</div><div class="kpi-lbl">Distance</div></div>
            <div class="kpi"><div class="kpi-val">${r.dplus ? fmtNum(r.dplus) + ' m' : '—'}</div><div class="kpi-lbl">Dénivelé +</div></div>
          </div>
        </div>
        ${r.notes ? `<div class="drawer-section"><div class="drawer-section-title">📝 Récit</div><div class="drawer-notes">${esc(r.notes)}</div></div>` : ''}
        ${mediaSections(r)}
      </div>`);
  }

  initPage({ requireAuth: true, onReady: loadPage });
</script>
</body>
</html>
